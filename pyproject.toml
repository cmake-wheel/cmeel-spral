[build-system]
build-backend = "cmeel"
requires = [
  "cmeel-autoconf",
  "cmeel-gklib",
  "cmeel-hwloc",
  "cmeel-metis",
  "cmeel-openblas",
  "cmeel[build]",
  "meson",
  "ninja"
]

[project]
description = "cmeel distribution for SPRAL"
license = "BSD-3-Clauses"
name = "cmeel-spral"
requires-python = ">= 3.10"
version = "2025.09.18"

[project.urls]
homepage = "https://github.com/cmake-wheel/cmeel-spral"
repository = "https://github.com/cmake-wheel/cmeel-spral.git"

[tool.cmeel]
has-sitelib = false
run-tests = false

[tool.tomlsort]
all = true
